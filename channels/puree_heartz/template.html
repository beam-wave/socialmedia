/* Art: soft romantic cards. Serif quote, handwritten signature, Hindi in Tiro Devanagari. Moods: blush, midnight, petal, dusk. */
.art{--a-bg:linear-gradient(172deg,#ffe9ee 0%,#f9cdd8 55%,#eeaabd 100%);--a-fg:#4a1e2c;--a-dim:rgba(74,30,44,.68);--a-hi:#b8325a;--a-ink:#fff;--a-rule:rgba(74,30,44,.22);--a-card:rgba(255,255,255,.4);--a-glow:rgba(255,255,255,.45);--a-glow2:rgba(184,50,90,.16);
  --a-paper:#fff8f9;--a-layer1:#ffd3de;--a-layer2:#f4a9bf;--a-shadow:rgba(140,30,70,.28);--a-peng:#2a2f4f;--a-rim:rgba(255,255,255,0);
  --a-display:"Cormorant Garamond","Tiro Devanagari Hindi",Georgia,serif;--a-display-w:600;--a-body:"Instrument Sans","Noto Sans Devanagari",system-ui,sans-serif;--a-script:"Caveat","Tiro Devanagari Hindi",cursive}

.art.t-petal{--a-bg:#fbf3ee;--a-fg:#3b2a26;--a-dim:rgba(59,42,38,.66);--a-hi:#c24d6b;--a-ink:#fff;--a-rule:rgba(59,42,38,.18);--a-card:rgba(255,255,255,.7);--a-glow:rgba(244,190,200,.5);--a-glow2:rgba(255,214,170,.45);
  --a-paper:#ffffff;--a-layer1:#f8dfe2;--a-layer2:#f2c9b6;--a-shadow:rgba(120,60,50,.22);--a-peng:#2e3350;--a-rim:rgba(255,255,255,0)}
.art.t-dusk{--a-bg:linear-gradient(172deg,#2b2d5a 0%,#7a4a8a 55%,#e79aa5 100%);--a-fg:#fff;--a-dim:rgba(255,255,255,.8);--a-hi:#ffd6e0;--a-ink:#3a1f45;--a-rule:rgba(255,255,255,.3);--a-card:rgba(255,255,255,.1);--a-glow:rgba(255,214,224,.3);--a-glow2:rgba(255,190,150,.3);
  --a-paper:#3b2e66;--a-layer1:#5d4685;--a-layer2:#a8708f;--a-shadow:rgba(20,10,40,.5);--a-peng:#1e2244;--a-rim:rgba(255,214,224,.5)}
/* Flat moods: one solid colour, no glow */
.art.t-butter{--a-bg:#ffe8a3;--a-fg:#3d2a1e;--a-dim:rgba(61,42,30,.66);--a-hi:#e2506b;--a-ink:#fff;--a-rule:rgba(61,42,30,.2);--a-paper:#fffdf6;--a-layer1:#ffd36b;--a-layer2:#f6a95c;--a-shadow:rgba(120,70,20,.22);--a-peng:#26304f;--a-rim:rgba(255,255,255,0)}
.art.t-mint{--a-bg:#cdeee1;--a-fg:#1f3b33;--a-dim:rgba(31,59,51,.66);--a-hi:#e0577e;--a-ink:#fff;--a-rule:rgba(31,59,51,.2);--a-paper:#ffffff;--a-layer1:#a6dcc6;--a-layer2:#78c3a6;--a-shadow:rgba(20,80,60,.2);--a-peng:#22304a;--a-rim:rgba(255,255,255,0)}

.cta-slide::before{display:none}
/* Quote card: the quote on stacked paper layers at the top, a goggled penguin popping up from the bottom edge */
.q{padding:76px 84px 0;display:flex;flex-direction:column;gap:30px;overflow:hidden}
.q.story{padding:150px 84px 0;gap:44px}
.art>*{position:relative;z-index:1}
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-dim);flex:none}
.q-top [lang=hi]{letter-spacing:0}
.q-top .h,.cta-top span:first-child{font-family:var(--a-script);text-transform:none;letter-spacing:0;font-size:44px;color:var(--a-hi)}
.q-stack{flex:1;min-height:0;margin:14px 10px 0;position:relative}
.q-layer{position:absolute;inset:0;border-radius:46px}
.q-layer.l2{background:var(--a-layer2);transform:rotate(-4.5deg) translate(-18px,26px);opacity:.9}
.q-layer.l1{background:var(--a-layer1);transform:rotate(3deg) translate(20px,14px)}
.q-card{position:relative;height:100%;border-radius:46px;background:var(--a-paper);box-shadow:0 34px 70px -34px var(--a-shadow);padding:70px 66px 46px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.q-pin{position:absolute;top:-38px;left:50%;transform:translateX(-50%) rotate(-8deg);width:76px;height:76px;border-radius:50%;background:var(--a-hi);color:var(--a-paper);display:grid;place-items:center;box-shadow:0 12px 24px -10px var(--a-shadow)}
.q-pin svg{width:40px;height:40px}
.q-text{font-family:var(--a-display);font-weight:600;line-height:1.12;margin:0;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center;text-wrap:balance}
.q[lang=hi] .q-text{line-height:1.5;font-weight:400}
.q-text em{font-style:italic;color:var(--a-hi)}
.q[lang=hi] .q-text em{font-style:normal}
.q-rule{width:110px;height:2px;background:var(--a-hi);opacity:.7;flex:none}
.q-alt{font-family:var(--a-display);font-size:40px;line-height:1.45;color:var(--a-dim);margin:0;flex:none;max-height:180px;overflow:hidden;text-wrap:balance}
.q-alt em{font-style:normal;color:var(--a-hi)}
.q-by{font-family:var(--a-script);font-size:52px;line-height:1;color:var(--a-hi);flex:none}
.q-note{font-size:28px;line-height:1.35;color:var(--a-dim);margin:0;max-width:780px;flex:none;max-height:76px;overflow:hidden}
.q-bottom{flex:none;height:450px;position:relative;margin-top:-6px}
.q.story .q-bottom{height:700px}
.peng{position:absolute;left:50%;bottom:0;width:520px;transform:translateX(-50%);filter:drop-shadow(0 -8px 30px var(--a-shadow))}
.q.story .peng{width:780px}
.peng svg{display:block;width:100%;height:auto;overflow:visible}
.peng .body{fill:var(--a-peng);stroke:var(--a-rim);stroke-width:4}
.peng .strap,.peng .rim{fill:none;stroke:var(--a-hi)}
.peng .heart{fill:var(--a-hi)}
.q-side{position:absolute;bottom:56px;max-width:160px;font-size:24px;line-height:1.35;color:var(--a-dim);letter-spacing:.04em}
.q-side.left{left:0}
.q-side.right{right:0;text-align:right}
.q-side b{display:block;font-family:var(--a-script);font-weight:700;font-size:40px;letter-spacing:0;color:var(--a-hi);line-height:1.05;margin-bottom:6px}
/* Footer: the comment question and a follow nudge, small, under the card */
.q-foot{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;font-size:24px;line-height:1.3;color:var(--a-dim);text-align:left;margin-top:8px}
.q-foot svg{width:32px;height:32px;flex:none;color:var(--a-hi)}
.q-foot .t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-foot .t em{font-style:normal;color:var(--a-hi);font-weight:600}
.q-foot b{flex:none;font-family:var(--a-script);font-size:34px;font-weight:700;color:var(--a-hi);border:2px solid var(--a-hi);border-radius:999px;padding:0 18px 2px;line-height:1.2}
.q-bottom{height:380px}
.q-card{padding:58px 60px 36px;gap:18px;box-sizing:border-box;max-height:100%}
.q-alt{font-size:36px;max-height:160px}
.q-by{font-size:46px}
.q-note{font-size:25px;max-height:34px}
.q.story .q-bottom{height:640px}
/* Reel (format "reel"), 10 s: the card settles in, the penguin pops up and blows two
   flying kisses (2.4s and 6s) with hearts floating out of its beak, and little hearts
   drift up the whole card. The recorder steps every animation frame by frame. */
.q-float,.q-kiss,.peng .kisser{display:none}
.reel .peng .kisser{display:inline}
.reel .q-float{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.reel .q-float i{position:absolute;bottom:-80px;width:var(--s);height:var(--s);color:var(--a-hi);opacity:0;animation:pFloat var(--d) var(--delay) infinite linear}
.reel .q-float i svg,.q-kiss i svg{width:100%;height:100%;display:block}
.reel .q-stack{animation:pIn .9s .05s both cubic-bezier(.2,.8,.2,1)}
.reel .q-text,.reel .q-alt,.reel .q-by,.reel .q-rule{animation:pFade .8s .5s both}
.reel .q-alt,.reel .q-rule{animation-delay:1s}
.reel .q-by{animation-delay:1.4s}
.reel .q-foot{animation:pFade .7s 1.8s both}
.reel .peng svg{animation:pPop .8s .6s both cubic-bezier(.3,1.5,.5,1),pBob 1.8s 1.4s infinite alternate ease-in-out}
.reel .peng .kisser{opacity:0;transform-box:fill-box;transform-origin:100% 100%;animation:pArm 3.6s 2.4s 2 both ease-in-out}
.reel .peng .lips{transform-box:fill-box;transform-origin:center;animation:pLips 3.6s 2.4s 2 both ease-out}
.reel .peng .happy{animation:pHappy 3.6s 2.4s 2 both}
.reel .peng .eyes{animation:pEyes 3.6s 2.4s 2 both}
.reel .peng .cheek{animation:pBlush 3.6s 2.4s 2 both ease-in-out}
.reel .peng .wing{transform-box:fill-box;transform-origin:12% 92%;animation:pWave 1.2s 1.4s infinite alternate ease-in-out}
.reel .q-kiss{display:block;position:absolute;left:50%;top:76%;width:0;height:0}
.reel .q-kiss i{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);color:var(--c,var(--a-hi));opacity:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));animation:pHeart 3.6s calc(3.55s + var(--k) * .11s) 2 both ease-out}
@keyframes pIn{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pFade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pPop{from{transform:translateY(105%)}to{transform:none}}
@keyframes pBob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes pArm{0%{opacity:0;transform:rotate(30deg)}9%{opacity:1;transform:none}30%{opacity:1;transform:none}40%{opacity:1;transform:rotate(70deg)}50%{opacity:0;transform:rotate(70deg)}100%{opacity:0;transform:rotate(70deg)}}
@keyframes pLips{0%,7%{opacity:0;transform:scale(.3)}13%,31%{opacity:1;transform:scale(1.15)}22%{transform:scale(.9)}40%,100%{opacity:0;transform:scale(1.6)}}
@keyframes pHappy{0%,8%{opacity:0}12%,38%{opacity:1}44%,100%{opacity:0}}
@keyframes pEyes{0%,8%{opacity:1}12%,38%{opacity:0}44%,100%{opacity:1}}
@keyframes pWave{from{transform:rotate(0)}to{transform:rotate(-10deg)}}
@keyframes pBlush{0%,15%{opacity:.55}30%,50%{opacity:1}70%,100%{opacity:.55}}
@keyframes pHeart{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}6%{opacity:1;transform:translate(calc(var(--dx) * .2),-60px) scale(1)}30%{opacity:1}52%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.35) rotate(var(--r))}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.35)}}
@keyframes pFloat{0%{opacity:0;transform:translate(0,0) rotate(-10deg)}10%{opacity:.45}50%{transform:translate(30px,-60vh) rotate(10deg)}90%{opacity:.35}100%{opacity:0;transform:translate(-20px,-125vh) rotate(-8deg)}}
</style></head>

    const main=hiMain?(q.quote_hi||q.quote):q.quote, alt=(lang==="both"&&!hiMain&&q.quote_hi)?q.quote_hi:"";
    const note=lang==="en"?q.note:(q.note_hi||q.note);
    const by=q.author?`— ${esc(q.author)}`:`— ${esc(d.signature||d.handle)}`;
    const h=hookOf(d,q,HOOKS[0]);
    const t=lang==="hi"?L.hi:L.en;
    const card=`<section class="art q ${theme}${story?" story":""}${reel?" reel":""}"${reel?' data-seconds="10"':""} lang="${hiMain?"hi":"en"}">
      ${reel?`<div class="q-float">${FLOAT.map(([l,s,dd,dl])=>`<i style="left:${l}%;--s:${s}px;--d:${dd}s;--delay:${dl}s">${HEART}</i>`).join("")}</div>`:""}
      <div class="q-top"><span lang="${lang==="hi"?"hi":"en"}">${t.top}${q.number?" · "+esc(q.number):""}</span><span class="h">${esc(d.handle)}</span></div>
      <div class="q-stack"><div class="q-layer l2"></div><div class="q-layer l1"></div>
        <div class="q-card"><div class="q-pin">${ICON.heart}</div>
          <p class="q-text fit" data-max="${story?92:(alt?68:82)}" data-min="36"><span>${hl(main)}</span></p>
          ${alt?`<div class="q-rule"></div><p class="q-alt" lang="hi">${hl(alt)}</p>`:""}
          <div class="q-by">${by}</div>
          ${note?`<p class="q-note">${esc(note)}</p>`:""}
        </div></div>
      <div class="q-foot">${BUBBLE}<span class="t">${hl(lang==="hi"?(h.q_hi||h.q):h.q)} ${t.comment}</span><b>${t.follow}</b></div>
      <div class="q-bottom">
        <div class="peng">${PENGUIN}${reel?`<div class="q-kiss">${KISS.map(([dx,dy,s,r,c],k)=>`<i style="--dx:${dx}px;--dy:${dy}px;--s:${s}px;--r:${r}deg;--k:${k}${c?";--c:"+c:""}">${HEART}</i>`).join("")}</div>`:""}</div>
      </div></section>`;
    const body=lang==="en"?clean(q.quote):lang==="hi"?clean(q.quote_hi||q.quote):`${clean(q.quote)}\n\n${clean(q.quote_hi)}`;
    const hh=lang==="en"?{...h,q_hi:""}:lang==="hi"?{...h,q:h.q_hi||h.q,q_hi:""}:h;
    const caption=`${body}${q.author?"\n— "+q.author:""}

${captionHook(hh)}

Follow ${d.handle} for a little love every day 🤍

${d.tags||""}`;
    return {id:"q"+(q.number||String(i+1).padStart(2,"0")),label:`Quote ${q.number||i+1} · ${q.date||""}`,slides:[{name:reel?"reel":"card",html:card,size}],caption};
  });
}

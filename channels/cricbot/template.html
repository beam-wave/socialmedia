<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricbot Promo Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Teko:wght@500;600&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<link rel="stylesheet" href="../_shared/studio.css">
<style>
/* Art: an ad poster for boosting. "AI cricket analyst in your DMs": one big promise, a chat
   mock-up with a real-looking answer, four feature chips and a Send-message call to action.
   Themes: stadium (navy + electric green), volt (black + lime), dusk (deep purple + amber). */
.art{--a-bg:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(34,229,132,.22) 0,transparent 60%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(56,120,255,.22) 0,transparent 70%),linear-gradient(180deg,#0a1224 0%,#070b17 100%);
  --a-fg:#ffffff;--a-dim:rgba(255,255,255,.72);--a-hi:#22e584;--a-ink:#04140c;--a-rule:rgba(255,255,255,.14);--a-card:rgba(255,255,255,.06);--a-glow:transparent;
  --a-display:"Barlow Condensed","Noto Sans Devanagari","Arial Narrow",sans-serif;--a-display-w:800;--a-body:"Barlow","Noto Sans Devanagari",system-ui,sans-serif;--a-score:"Teko","Barlow Condensed",sans-serif;
  --cb-grid:rgba(255,255,255,.035);--cb-me:#2b6cff;--cb-bot:rgba(255,255,255,.08)}
.art.t-volt{--a-bg:radial-gradient(ellipse 70% 45% at 0% 0%,rgba(198,255,61,.18) 0,transparent 65%),linear-gradient(180deg,#0b0b0b 0%,#050505 100%);--a-hi:#c6ff3d;--a-ink:#111;--cb-me:#ffffff;--cb-bot:rgba(255,255,255,.07)}
.art.t-dusk{--a-bg:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,176,59,.25) 0,transparent 60%),linear-gradient(180deg,#1b0f33 0%,#0d0820 100%);--a-hi:#ffb03b;--a-ink:#1a0d00;--cb-me:#7c4dff}
.art::after{display:none}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--cb-grid) 2px,transparent 2px) 0 0/60px 60px,linear-gradient(90deg,var(--cb-grid) 2px,transparent 2px) 0 0/60px 60px;pointer-events:none}
.art>*{position:relative}
.cb{padding:62px 76px 54px;display:flex;flex-direction:column;gap:22px;color:var(--a-fg);font-family:var(--a-body)}
.cb.story{padding:170px 76px 190px;gap:40px}
.cb.story .cb-chat{flex:none;margin:auto 0}
.cb-top{display:flex;justify-content:space-between;align-items:center;flex:none}
.cb-brand{display:flex;align-items:center;gap:16px;font-family:var(--a-display);font-weight:800;font-size:44px;letter-spacing:.04em}
.cb-brand svg{width:58px;height:58px}
.cb-chip{font-family:var(--a-display);font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-ink);background:var(--a-hi);padding:10px 20px;border-radius:999px}
.cb-head{font-family:var(--a-display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.005em;flex:none}
.cb-head em{font-style:normal;color:var(--a-hi)}
.cb-sub{font-size:34px;line-height:1.3;color:var(--a-dim);margin:-6px 0 0;font-weight:500;flex:none;max-width:900px}
.cb-sub b{color:var(--a-fg);font-weight:600}
/* chat mock-up */
.cb-chat{flex:1;min-height:0;border-radius:34px;background:rgba(10,16,32,.72);border:1.5px solid var(--a-rule);box-shadow:0 40px 80px -40px rgba(0,0,0,.8),0 0 0 8px rgba(255,255,255,.03);padding:22px 28px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.art.t-volt .cb-chat{background:rgba(20,20,20,.85)}
.cb-chat-top{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1.5px solid var(--a-rule)}
.cb-avatar{width:54px;height:54px;border-radius:50%;background:var(--a-hi);display:grid;place-items:center}
.cb-avatar svg{width:38px;height:38px}
.cb-chat-top b{font-size:30px;font-weight:700;display:block}
.cb-chat-top span{font-size:22px;color:var(--a-hi);font-weight:600}
.cb-chat-top span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--a-hi);margin-right:8px;vertical-align:1px;box-shadow:0 0 12px var(--a-hi)}
.cb-msg{max-width:84%;padding:16px 22px;border-radius:26px;font-size:27px;line-height:1.32;font-weight:500}
.cb-msg.me{align-self:flex-end;background:var(--cb-me);color:#fff;border-bottom-right-radius:8px}
.art.t-volt .cb-msg.me{color:#111}
.cb-msg.bot{align-self:flex-start;background:var(--cb-bot);border-bottom-left-radius:8px}
.cb-msg.bot strong{color:var(--a-hi);font-weight:700}
.cb-win{margin-top:14px;display:grid;gap:8px}
.cb-win div{display:flex;justify-content:space-between;font-family:var(--a-display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.cb-bar{height:16px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.cb-bar i{display:block;height:100%;background:var(--a-hi);border-radius:999px}
.cb-typing{align-self:flex-start;display:flex;gap:8px;padding:16px 22px;border-radius:22px;background:var(--cb-bot)}
.cb-typing i{width:12px;height:12px;border-radius:50%;background:var(--a-dim)}
/* features + call to action */
.cb-feats{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:none}
.cb-feat{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--a-card);border:1.5px solid var(--a-rule);font-size:27px;font-weight:600;line-height:1.15}
.cb-feat svg{width:40px;height:40px;flex:none;color:var(--a-hi)}
.cb-cta{display:flex;align-items:center;gap:22px;flex:none}
.cb-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--a-hi);color:var(--a-ink);font-family:var(--a-display);font-weight:800;font-size:44px;letter-spacing:.03em;text-transform:uppercase;padding:24px 28px;border-radius:24px;box-shadow:0 18px 40px -16px var(--a-hi)}
.cb-btn svg{width:46px;height:46px}
.cb-cta p{margin:0;font-size:24px;line-height:1.35;color:var(--a-dim);max-width:270px}
.cb-cta p b{color:var(--a-fg)}
.cb-foot{display:flex;justify-content:space-between;font-size:22px;color:var(--a-dim);flex:none}
</style></head>
<body><div id="app"></div>
<script src="../_shared/studio.js"></script>
<script>
const {esc,hl,clean}=Studio;
const ICON={
  ball:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#e63946" stroke="#111" stroke-width="4"/><path d="M12 22q20 12 40 0M12 42q20-12 40 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-dasharray="2 6" stroke-linecap="round"/></svg>`,
  bot:`<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--a-ink)"><rect x="7" y="12" width="26" height="20" rx="7"/><path d="M20 12V6"/><circle cx="20" cy="5" r="2"/><circle cx="15" cy="22" r="2" fill="currentColor"/><circle cx="25" cy="22" r="2" fill="currentColor"/><path d="M3 20v6M37 20v6"/></svg>`,
  chart:`<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 35h30"/><rect x="8" y="20" width="6" height="12" rx="1.5"/><rect x="17" y="12" width="6" height="20" rx="1.5"/><rect x="26" y="6" width="6" height="26" rx="1.5"/></svg>`,
  versus:`<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="6"/><circle cx="28" cy="13" r="6"/><path d="M3 34c1.5-7 5-10 9-10s7.5 3 9 10M19 34c1.5-7 5-10 9-10s7.5 3 9 10"/></svg>`,
  pitch:`<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="3" width="14" height="34" rx="3"/><path d="M13 11h14M13 29h14"/><path d="M17 5v4M20 5v4M23 5v4"/></svg>`,
  bell:`<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 28V18a10 10 0 1 1 20 0v10l3 4H7l3-4z"/><path d="M16 35a4 4 0 0 0 8 0"/></svg>`,
  send:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24c0-8.8 7.2-15 16-15s16 6.2 16 15-7.2 15-16 15c-2.5 0-4.9-.5-7-1.4L8 40l2.4-7.2C8.9 30.3 8 27.3 8 24z"/></svg>`
};
const FEAT_ICONS=["chart","versus","pitch","bell"];
const HOOKS=[
  {q:"Ask me *who wins tonight* and why."},
  {q:"Which *matchup* decides this game? Ask me."},
  {q:"Want the *pitch report* before the toss?"}
];
function posts(d){
  return (d.posters||[]).map((p,i)=>{
    const story=d.format==="story", size=story?"story":"post", theme="t-"+(p.theme||d.theme||"stadium");
    const chat=(p.chat||[]).slice(0,3), w=p.win;
    const art=`<section class="art cb ${theme}${story?" story":""}">
      <div class="cb-top"><div class="cb-brand">${ICON.ball}${esc(d.brand||"CRICBOT")}</div><span class="cb-chip">${esc(p.chip||"AI cricket analyst")}</span></div>
      <h1 class="cb-head fit" data-max="${story?150:108}" data-min="70" data-axis="w"><span>${hl(p.headline)}</span></h1>
      <p class="cb-sub">${hl(p.sub).replace(/<em>/g,"<b>").replace(/<\/em>/g,"</b>")}</p>
      <div class="cb-chat">
        <div class="cb-chat-top"><div class="cb-avatar">${ICON.bot}</div><div><b>${esc(d.brand||"Cricbot")}</b><span>online · replies in seconds</span></div></div>
        ${chat.map(m=>`<div class="cb-msg ${m.from==="me"?"me":"bot"}">${hl(m.text).replace(/<em>/g,"<strong>").replace(/<\/em>/g,"</strong>")}${m.from!=="me"&&w&&m===chat[chat.length-1]?`<div class="cb-win"><div><span>${esc(w.team1)} ${esc(w.p1)}%</span><span>${100-(+w.p1||0)}% ${esc(w.team2)}</span></div><div class="cb-bar"><i style="width:${+w.p1||50}%"></i></div></div>`:""}</div>`).join("")}
        ${(story||!w)&&p.typing!==false?`<div class="cb-typing"><i></i><i></i><i></i></div>`:""}
      </div>
      <div class="cb-feats">${(p.features||[]).slice(0,4).map((f,j)=>`<div class="cb-feat">${ICON[FEAT_ICONS[j]]}<span>${esc(f)}</span></div>`).join("")}</div>
      <div class="cb-cta"><div class="cb-btn">${ICON.send}${esc(p.cta||"Send me a message")}</div><p>${hl(p.cta_sub||"Type *HI* to start. Free, no sign-up.").replace(/<em>/g,"<b>").replace(/<\/em>/g,"</b>")}</p></div>
      <div class="cb-foot"><span>${esc(d.handle)}</span><span>${esc(p.disclaimer||"Cricket insights, not betting tips")}</span></div>
    </section>`;
    const caption=`${clean(p.caption_hook||p.headline)}

${clean(p.sub)}

${(p.features||[]).map(f=>"✅ "+f).join("\n")}

💬 ${clean(p.cta_sub||"Type HI to start. Free, no sign-up.")}
👉 Tap Message or DM us "HI"

${d.tags||""}`;
    return {id:"promo"+String(i+1).padStart(2,"0"),label:`Promo ${i+1}`,slides:[{name:"poster",html:art,size}],caption};
  });
}
Studio.mount({
  channel:"@cricbot", title:"Cricbot Promo Studio", accent:"#22e584", itemsKey:"posters",
  sub:"One-slide ad posters to boost with a Send-message goal: a promise, a chat mock-up, four features and a message button.",
  note:"Keep claims honest: insights and stats, never guaranteed wins or betting tips (Meta restricts gambling-style ads).",
  controls:[{key:"theme",label:"Theme",perItem:true,options:[["stadium","Stadium (navy + green)"],["volt","Volt (black + lime)"],["dusk","Dusk (purple + amber)"]]},{key:"format",label:"Size",options:[["post","Feed post 4:5"],["story","Story / Reel 9:16"]]}],
  hooks:HOOKS, posts,
  guide:[["headline","The promise, under 6 words.","Wrap the punch phrase in *stars*."],["sub","One line on what you get.","*stars* make words bold."],["chat","2–3 messages: from me / bot.","The last bot message shows the win-chance bar if win is set."],["win","team1, team2, p1 (team1 %).","Shown under the last bot reply."],["features","Exactly 4 short benefits.","Icons: stats, matchups, pitch, alerts."],["cta / cta_sub","The button and the line beside it.","Match the boost's Send-message goal."]],
  sample:{theme:"stadium",format:"post",brand:"Cricbot",handle:"@cricbot",
    tags:"#cricket #cricketanalytics #iplanalysis #cricketstats #indiancricket #cricketlovers #cricbot",
    posters:[
      {headline:"Be ahead of *every ball*.",sub:"Your personal cricket analyst: *win chances, matchups, pitch reports and player form*, in your DMs.",chip:"AI cricket analyst",
       chat:[{from:"me",text:"Who has the edge in IND v AUS tonight?"},{from:"bot",text:"India, narrowly. *Bumrah* has dismissed Head 4 times in 7 innings, and Wankhede chases win *62%* at night."}],
       win:{team1:"IND",team2:"AUS",p1:58},
       features:["Live match insights","Player matchups","Pitch & venue stats","Match-day alerts"],
       cta:"Send me a message",cta_sub:"Type *HI* to start. Free, no sign-up.",caption_hook:"Want to read the game before it happens? 🏏📊"},
      {theme:"volt",headline:"Know the game *before it happens*.",sub:"Ask any cricket question. Get *stats-backed answers in seconds*.",chip:"Ask me anything",
       chat:[{from:"me",text:"Bat or bowl first at Chepauk?"},{from:"bot",text:"Bowl. Teams chasing at Chepauk won *7 of the last 10* night games; dew sets in after over 12."}],
       features:["Toss & venue trends","Head-to-head records","Form over last 10","Fixtures & reminders"],
       cta:"Chat with Cricbot",cta_sub:"DM *HI*. Answers in seconds."}
    ]}
});
</script></body></html>
